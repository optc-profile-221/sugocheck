<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07131f">
  <meta name="description" content="스고 체크리스트">
  <title>스고컬렉션</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <div class="brand" aria-label="스고체크">
        <span class="brand__mark">OPTC</span>
        <span><b>Legends Checklist</b><small>스고체크</small></span>
      </div>
      <label class="search">
        <span class="sr-only">캐릭터 검색</span>
        <input id="search" type="search" placeholder="이름 또는 도감번호 검색" autocomplete="off">
        <kbd>/</kbd>
      </label>
    </div>
  </header>

  <main class="app-shell">
    <section class="dashboard" aria-label="전체 진행 현황">
      <div class="dashboard__intro">
        <p class="eyebrow">OPTC Legends Checklist</p>
        <h1>스고 체크리스트</h1>
      </div>
      <div class="progress-ring" aria-label="전체 보유율">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="progress-ring__track" cx="60" cy="60" r="50"></circle>
          <circle id="progress-ring" class="progress-ring__value" cx="60" cy="60" r="50"></circle>
        </svg>
        <strong id="progress-percent">0%</strong>
      </div>
      <div class="metrics">
        <div class="metric metric--owned"><span>전체 캐릭터</span><strong id="count-owned">0 / 0</strong></div>
        <div class="metric metric--rainbow"><span>무지개</span><strong id="count-rainbow">0 / 0</strong></div>
        <div class="metric metric--super"><span>초무지개</span><strong id="count-super">0 / 0</strong></div>
        <div class="metric metric--key"><span>해적제한돌</span><strong id="count-pirate">0 / 0</strong></div>
      </div>
    </section>

    <section class="command-deck" aria-label="체크리스트 도구">
      <div class="mode-picker" id="mode-picker" role="radiogroup" aria-label="표시 모드">
        <button class="mode is-active" data-mode="owned" role="radio" aria-checked="true"><i class="dot dot--owned"></i>보유</button>
        <button class="mode" data-mode="rainbow" role="radio" aria-checked="false"><i class="dot dot--rainbow"></i>무지개</button>
        <button class="mode" data-mode="super" role="radio" aria-checked="false"><i class="dot dot--super"></i>초무지개</button>
        <button class="mode" data-mode="pirate" role="radio" aria-checked="false"><i class="dot dot--key">◆</i>해적제한돌</button>
        <button class="mode" data-mode="llb" role="radio" aria-checked="false"><i class="dot dot--llb">5</i>레벨상한돌파</button>
        <button class="mode" data-mode="hide" role="radio" aria-checked="false"><i class="dot dot--hide">×</i>목록에서 제거</button>
      </div>
      <div class="actions">
        <button id="select-all" class="action action--primary">현재 모드 전체 적용</button>
        <button id="toggle-base" class="action">초진화캐릭터 제거</button>
        <button id="restore-hidden" class="action">지운 캐릭터 복구 <span id="hidden-count">0</span></button>
        <button id="show-hidden" class="action">지운 캐릭터 목록</button>
        <button id="export-image" class="action">이미지로 추출</button>
        <button id="backup" class="action">저장파일 관리</button>
        <button id="reset" class="action action--danger">초기화</button>
      </div>
    </section>

    <div id="empty-search" class="empty-search" hidden>검색 결과가 없습니다.</div>
    <div id="checklists" class="checklists" aria-live="polite"></div>
  </main>

  <footer>
  </footer>

  <dialog id="hidden-dialog" class="sheet">
    <form method="dialog" class="sheet__bar"><div><p class="eyebrow">REMOVED</p><h2>지운 캐릭터</h2></div><button class="icon-button" aria-label="닫기">×</button></form>
    <p class="sheet__help">복구할 캐릭터를 누르세요.</p>
    <div id="hidden-list" class="hidden-list"></div>
  </dialog>

  <dialog id="backup-dialog" class="sheet sheet--small">
    <form method="dialog" class="sheet__bar"><div><p class="eyebrow">SAVE DATA</p><h2>저장파일 관리</h2></div><button class="icon-button" aria-label="닫기">×</button></form>
    <p class="sheet__help">체크 현황은 이 브라우저에 자동 저장됩니다. 다른 기기로 옮길 때 JSON 파일을 이용하세요.</p>
    <div class="backup-actions">
      <button id="download-save" class="action action--primary">저장파일 내려받기</button>
      <label class="action file-action">저장파일 불러오기<input id="upload-save" type="file" accept="application/json,.json"></label>
    </div>
  </dialog>

  <dialog id="export-dialog" class="sheet export-sheet">
    <form method="dialog" class="sheet__bar"><div><p class="eyebrow">SHARE CARD</p><h2>도감 이미지</h2></div><button class="icon-button" aria-label="닫기">×</button></form>
    <p id="export-status" class="sheet__help">이미지를 준비하고 있습니다.</p>
    <div id="export-preview" class="export-preview"></div>
    <button id="download-image" class="action action--primary" hidden>PNG 내려받기</button>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
